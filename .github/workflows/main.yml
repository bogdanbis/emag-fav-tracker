name: Fetch Prices

on:
  schedule:
    # runs at  9,11,16,22
    - cron: '0 6,9,13,19 * * *' # UTC Time = Bucharest time - 3 hours
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '24'
      - run: node index.js
        env:
          SOURCE: "GitHub Actions"
          EMAG_COOKIE: ${{ secrets.EMAG_COOKIE }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
